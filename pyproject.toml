[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "comp6704-lasso-optimization"
version = "0.1.0"
description = "Reproducible comparison of ISTA, FISTA, restarted FISTA, and ADMM"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Colin_Wang"}]
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11", "pandas>=2.1", "scikit-learn>=1.3", "matplotlib>=3.8", "threadpoolctl>=3.2"]

[project.optional-dependencies]
dev = ["pytest>=8", "pymupdf>=1.24"]

[project.urls]
Homepage = "https://github.com/Yuchen-Wang-CHN/comp6704-lasso-optimization"
Repository = "https://github.com/Yuchen-Wang-CHN/comp6704-lasso-optimization"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
